<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./assets/images/favicon-32x32.png"
        />

        <title>QR code component | Frontend Mentor</title>

        <link rel="stylesheet" href="./assets/css/styles.css" />
    </head>
    <body>
        <main>
            <div class="card">
                <img
                    class="card__image"
                    src="./assets/images/image-qr-code.png"
                    alt="QR code linking to Frontend Mentor"
                />
                <div class="card__body">
                    <h1>
                        Improve your frontend skills by building projects
                    </h1>
                    <p>
                        Scan the QR code to visit Frontend Mentor and take your
                        coding skills to the next level
                    </p>
                </div>
            </div>
        </main>
        <footer class="attribution">
            Challenge by
            <a href="https://www.frontendmentor.io?ref=challenge"
                >Frontend Mentor</a
            >. Coded by
            <a href="https://github.com/logicalplum">John F MacDonald</a>.
        </footer>
    </body>
</html>
